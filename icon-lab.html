<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>censor icon lab</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, monospace; background: #16161c; color: #d8d8e0; margin: 0; padding: 24px; }
  h1 { font-size: 15px; font-weight: normal; margin: 0 0 20px; color: #9a9aa8; }
  .layout { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start; }
  .controls { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 14px; align-items: center; min-width: 340px; }
  .controls label { font-size: 12px; color: #9a9aa8; }
  .controls output { font-size: 12px; color: #d8d8e0; text-align: right; min-width: 48px; }
  input[type=range] { width: 220px; accent-color: #8a8af0; }
  input[type=color] { width: 40px; height: 24px; border: none; background: none; padding: 0; }
  input[type=text] { background: #23232b; color: #d8d8e0; border: 1px solid #3a3a46; padding: 3px 8px; font: inherit; font-size: 12px; width: 180px; }
  input[type=checkbox] { accent-color: #8a8af0; }
  .previews { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .pv { text-align: center; }
  .pv div { font-size: 10px; color: #6a6a78; margin-top: 4px; }
  canvas { background: #0c0c10; image-rendering: auto; }
  .downloads { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  button { background: #23232b; color: #d8d8e0; border: 1px solid #3a3a46; padding: 6px 14px; font: inherit; font-size: 12px; cursor: pointer; border-radius: 4px; }
  button:hover { background: #2d2d38; }
</style>
</head>
<body>
<h1>censor icon lab — tweak, then download + replace files in icons/</h1>
<div class="layout">
  <div class="controls">
    <label>pixel block</label><input id="block" type="range" min="4" max="64" step="1" value="14"><output id="block-o"></output>
    <label>split %</label><input id="split" type="range" min="0" max="100" step="1" value="50"><output id="split-o"></output>
    <label>letter size %</label><input id="lsize" type="range" min="5" max="200" step="1" value="97"><output id="lsize-o"></output>
    <label>letter x</label><input id="xoff" type="range" min="-128" max="128" step="1" value="13"><output id="xoff-o"></output>
    <label>letter y</label><input id="yoff" type="range" min="-128" max="128" step="1" value="0"><output id="yoff-o"></output>
    <label>letter</label><input id="char" type="text" value="A" maxlength="2"><span></span>
    <label>font</label><input id="font" type="text" value="'Times New Roman', 'Liberation Serif', serif"><span></span>
    <label>bold</label><input id="bold" type="checkbox"><span></span>
    <label>checker cell</label><input id="cell" type="range" min="16" max="256" step="8" value="128"><output id="cell-o"></output>
    <label>color 1</label><input id="c1" type="color" value="#bcbcbc"><span></span>
    <label>color 2</label><input id="c2" type="color" value="#e7e7e7"><span></span>
    <label>letter color</label><input id="c3" type="color" value="#000000"><span></span>
    <label>drop shadow</label><input id="shadow" type="checkbox" checked><span></span>
    <label>shadow blur</label><input id="sblur" type="range" min="0" max="64" step="1" value="12"><output id="sblur-o"></output>
    <label>shadow x</label><input id="sx" type="range" min="-32" max="32" step="1" value="0"><output id="sx-o"></output>
    <label>shadow y</label><input id="sy" type="range" min="-32" max="32" step="1" value="6"><output id="sy-o"></output>
    <label>shadow alpha</label><input id="salpha" type="range" min="0" max="100" step="1" value="60"><output id="salpha-o"></output>
    <label>shadow color</label><input id="scolor" type="color" value="#000000"><span></span>
    <label>corner radius</label><input id="radius" type="range" min="0" max="256" step="4" value="112"><output id="radius-o"></output>
  </div>
  <div class="previews">
    <div class="row">
      <div class="pv"><canvas id="pv512" width="512" height="512" style="width:256px;height:256px"></canvas><div>512</div></div>
      <div class="pv"><canvas id="pv192" width="192" height="192" style="width:96px;height:96px"></canvas><div>192</div></div>
      <div class="pv"><canvas id="pv180" width="180" height="180" style="width:90px;height:90px"></canvas><div>180</div></div>
    </div>
    <div class="row">
      <div class="pv"><canvas id="pv64" width="64" height="64" style="width:64px;height:64px"></canvas><div>64</div></div>
      <div class="pv"><canvas id="pv32" width="32" height="32" style="width:32px;height:32px"></canvas><div>32</div></div>
      <div class="pv"><canvas id="pv16" width="16" height="16" style="width:16px;height:16px"></canvas><div>16</div></div>
      <div class="pv"><canvas id="pvmask" width="512" height="512" style="width:128px;height:128px"></canvas><div>maskable</div></div>
    </div>
  </div>
</div>
<div class="downloads">
  <button id="savezip">save zip (to server ~/Downloads)</button>
  <button id="apply">apply to server (overwrite icons/)</button>
  <button id="copyparams">copy params</button>
  <input id="parambox" type="text" placeholder="paste params JSON, press enter" style="width:280px">
</div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ids = ['block','split','lsize','xoff','yoff','char','font','bold','cell','c1','c2','c3','shadow','sblur','sx','sy','salpha','scolor','radius'];
const opts = {};
function readOpts() {
  for (const id of ids) {
    const el = $(id);
    opts[id] = el.type === 'checkbox' ? el.checked : el.value;
  }
  $('block-o').textContent = opts.block + 'px';
  $('split-o').textContent = opts.split + '%';
  $('lsize-o').textContent = opts.lsize + '%';
  $('xoff-o').textContent = opts.xoff + 'px';
  $('yoff-o').textContent = opts.yoff + 'px';
  $('cell-o').textContent = opts.cell + 'px';
  $('radius-o').textContent = opts.radius + 'px';
  $('sblur-o').textContent = opts.sblur + 'px';
  $('sx-o').textContent = opts.sx + 'px';
  $('sy-o').textContent = opts.sy + 'px';
  $('salpha-o').textContent = opts.salpha + '%';
}
const letterCv = document.createElement('canvas');
const tinyCv = document.createElement('canvas');

function render(ctx, size, rounded) {
  const s = n => n * size / 512;
  ctx.fillStyle = opts.c1;
  ctx.fillRect(0, 0, size, size);
  const cell = Math.max(1, Math.round(s(+opts.cell)));
  ctx.fillStyle = opts.c2;
  for (let y = 0; y < size; y += cell)
    for (let x = 0; x < size; x += cell)
      if (((x / cell | 0) + (y / cell | 0)) % 2 === 0) ctx.fillRect(x, y, cell, cell);
  letterCv.width = letterCv.height = size;
  const l = letterCv.getContext('2d');
  l.clearRect(0, 0, size, size);
  l.fillStyle = opts.c3;
  const px = size * +opts.lsize / 100;
  l.font = (opts.bold ? 'bold ' : '') + px + 'px ' + opts.font;
  l.textAlign = 'center';
  l.textBaseline = 'middle';
  if (opts.shadow) {
    l.shadowColor = opts.scolor + Math.round(+opts.salpha * 255 / 100).toString(16).padStart(2, '0');
    l.shadowBlur = s(+opts.sblur);
    l.shadowOffsetX = s(+opts.sx);
    l.shadowOffsetY = s(+opts.sy);
  }
  l.fillText(opts.char || 'A', size / 2 + s(+opts.xoff), size / 2 + size * 0.03 + s(+opts.yoff));
  l.shadowColor = 'transparent';
  l.shadowBlur = 0;
  l.shadowOffsetX = 0;
  l.shadowOffsetY = 0;
  const cutX = Math.round(size * +opts.split / 100);
  const rw = size - cutX;
  if (rw > 0 && +opts.block > 1) {
    const f = Math.max(2, Math.round(s(+opts.block) * 2));
    tinyCv.width = Math.max(1, Math.round(rw / f));
    tinyCv.height = Math.max(1, Math.round(size / f));
    const t = tinyCv.getContext('2d');
    t.imageSmoothingEnabled = true;
    t.drawImage(letterCv, cutX, 0, rw, size, 0, 0, tinyCv.width, tinyCv.height);
    l.clearRect(cutX, 0, rw, size);
    l.imageSmoothingEnabled = false;
    l.drawImage(tinyCv, 0, 0, tinyCv.width, tinyCv.height, cutX, 0, rw, size);
  } else if (rw > 0) {
    l.clearRect(cutX, 0, rw, size);
  }
  ctx.drawImage(letterCv, 0, 0);
}

// master canvases, rendered once at 512 — every smaller size is a downscale of these
const masterRounded = document.createElement('canvas');
masterRounded.width = masterRounded.height = 512;
const masterMaskable = document.createElement('canvas');
masterMaskable.width = masterMaskable.height = 512;

function applyRound(ctx, size) {
  if (+opts.radius <= 0) return;
  ctx.globalCompositeOperation = 'destination-in';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, +opts.radius * size / 512);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

function renderIcon(cv, size, rounded) {
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  if (size === 512) {
    render(ctx, 512, rounded);
    if (rounded) applyRound(ctx, 512);
  } else {
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(rounded ? masterRounded : masterMaskable, 0, 0, size, size);
  }
}

function renderMasters() {
  let ctx = masterRounded.getContext('2d');
  ctx.clearRect(0, 0, 512, 512);
  render(ctx, 512, true);
  applyRound(ctx, 512);
  ctx = masterMaskable.getContext('2d');
  ctx.clearRect(0, 0, 512, 512);
  render(ctx, 512, false);
}

function update() {
  readOpts();
  renderMasters();
  renderIcon($('pv512'), 512, true);
  renderIcon($('pv192'), 192, true);
  renderIcon($('pv180'), 180, true);
  renderIcon($('pv64'), 64, true);
  renderIcon($('pv32'), 32, true);
  renderIcon($('pv16'), 16, true);
  renderIcon($('pvmask'), 512, false);
}

function iconCanvas(size, rounded) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  renderIcon(cv, size, rounded);
  return cv;
}

function buildFiles() {
  const png = (size, rounded) => iconCanvas(size, rounded).toDataURL('image/png').split(',')[1];
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">\n'
    + '  <image width="512" height="512" xlink:href="data:image/png;base64,' + masterRounded.toDataURL('image/png').split(',')[1] + '"/>\n</svg>\n';
  return {
    'icon-512.png': png(512, true),
    'icon-192.png': png(192, true),
    'icon-180.png': png(180, true),
    'icon-maskable-512.png': png(512, false),
    'icon.svg': btoa(svg),
  };
}

$('savezip').addEventListener('click', async () => {
  const zip = new JSZip();
  for (const [name, b64] of Object.entries(buildFiles())) zip.file(name, b64, { base64: true });
  const blob = await zip.generateAsync({ type: 'blob' });
  const res = await fetch('/save-zip', { method: 'POST', body: blob });
  $('savezip').textContent = res.ok ? 'saved to server!' : 'save failed: ' + res.status;
  setTimeout(() => $('savezip').textContent = 'save zip (to server ~/Downloads)', 2000);
});

$('apply').addEventListener('click', async () => {
  if (!confirm('overwrite the live files in icons/ on the server?')) return;
  const res = await fetch('/save-icons', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(buildFiles()),
  });
  $('apply').textContent = res.ok ? 'applied!' : 'failed: ' + res.status;
  setTimeout(() => $('apply').textContent = 'apply to server (overwrite icons/)', 2000);
});
$('copyparams').addEventListener('click', async () => {
  readOpts();
  const json = JSON.stringify(opts);
  $('parambox').value = json;
  try {
    await navigator.clipboard.writeText(json);
    $('copyparams').textContent = 'copied!';
    setTimeout(() => $('copyparams').textContent = 'copy params', 1200);
  } catch (e) {
    $('parambox').select();
  }
});
$('parambox').addEventListener('change', () => {
  try {
    const p = JSON.parse($('parambox').value);
    for (const id of ids) {
      if (p[id] === undefined) continue;
      const el = $(id);
      if (el.type === 'checkbox') el.checked = !!p[id];
      else el.value = p[id];
    }
    update();
  } catch (e) {
    $('parambox').value = 'bad json';
  }
});
ids.forEach(id => $(id).addEventListener('input', update));
document.fonts.ready.then(update);
update();
</script>
</body>
</html>
