services:
  censor-mcp:
    build: .
    container_name: censor-mcp
    user: "1000:1000"
    # Worst-case heap is ~500 MiB (2 admitted max-size calls: 4 rasters +
    # chunks + retained input bytes each); 768m leaves allocator headroom.
    mem_limit: 768m
    memswap_limit: 768m
    oom_score_adj: 500
    restart: unless-stopped
    read_only: true            # privacy: the app never touches disk anyway
    tmpfs:
      - /tmp:size=64m
    ports:
      - "127.0.0.1:8610:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ALLOWED_ORIGINS: https://*.lost.plus
      RATE_LIMIT_PER_MINUTE: "30"
      RATE_LIMIT_PER_HOUR: "240"
      CENSOR_WORKERS: "1"
      CENSOR_MAX_INFLIGHT: "2"
      TRUSTED_PROXY_IP: "172.30.0.1"
