[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "censor-mcp"
version = "1.0.0"
description = "MCP server that applies censor's blur/mosaic effects to images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0,<3.0",
  "pillow>=11.0,<13.0",
  "starlette>=0.47.0,<1.0",
  "uvicorn>=0.35.0,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<9.0"]

[project.scripts]
censor-mcp = "censor_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/censor_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
